{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">Spaced retrieval practice</span><h1>Flashcards</h1></div><form class="filters"><select id="section" name="section" onchange="this.form.submit()"><option value="">All domains</option>{% for group in taxonomy|groupby('section') %}<option value="{{group.grouper}}" {{'selected' if group.grouper==section}}>{{group.grouper}}</option>{% endfor %}</select><select id="subsection" name="subsection" onchange="this.form.submit()"><option value="">All subsections</option>{% for x in taxonomy %}<option data-section="{{x.section}}" value="{{x.subsection}}" {{'selected' if x.subsection==subsection}}>{{x.subsection}} ({{x.n}})</option>{% endfor %}</select></form></div>{% if card %}<section class="flashcard" data-card="{{card.id}}"><div class="card-face front"><span>{{card.section}} · {{card.subsection}}</span><h2>{{card.front}}</h2><button id="reveal" class="btn primary">Reveal answer</button></div><div class="card-face back hidden"><span>Answer</span><p>{{card.back}}</p><div class="ratings"><button data-quality="1">Again<small>1 day</small></button><button data-quality="3">Hard<small>short</small></button><button data-quality="4">Good<small>adaptive</small></button><button data-quality="5">Easy<small>longer</small></button></div></div></section>{% else %}<section class="card empty">No cards are due in this selection. Nice work.</section>{% endif %}{% endblock %}
