<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{% block title %}{{app_name}}{% endblock %}</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="{{url_for('static',filename='icon-192.png')}}"><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><script defer src="{{ url_for('static',filename='app.js') }}"></script></head><body>
<header class="topbar"><a class="brand" href="/">PSITE<span>Prep</span></a>{% if user %}<nav><a href="/dashboard">Dashboard</a><a href="/practice/setup">Practice</a><a href="/flashcards">Cards</a><a href="/analytics">Analytics</a><a href="/cohort">Cohort</a><a href="/bookmarks">Saved</a><form method="post" action="/logout" class="inline"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="link-button">Log out</button></form></nav>{% else %}<nav><a href="/install">Install app</a><a href="/login">Log in</a></nav>{% endif %}</header>
<main class="shell">{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main>
{% if user %}<nav class="mobile-nav"><a href="/dashboard">Home</a><a href="/practice/setup">Practice</a><a href="/flashcards">Cards</a><a href="/analytics">Stats</a><a href="/cohort">Cohort</a></nav>{% endif %}</body></html>
