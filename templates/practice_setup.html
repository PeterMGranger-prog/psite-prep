{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">Build a focused set</span><h1>Practice questions</h1></div></div><section class="card setup"><form method="post" action="/practice/start"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Exam domain<select id="section" name="section"><option value="">All domains</option>{% for group in taxonomy|groupby('section') %}<option value="{{group.grouper}}">{{group.grouper}}</option>{% endfor %}</select></label><label>Subsection<select id="subsection" name="subsection"><option value="">All subsections</option>{% for x in taxonomy %}<option data-section="{{x.section}}" value="{{x.subsection}}">{{x.subsection}} ({{x.count}})</option>{% endfor %}</select></label><label>Number of questions<input name="count" type="number" min="1" max="100" value="10"></label><div class="preset-row"><button type="button" data-count="5">5</button><button type="button" data-count="10">10</button><button type="button" data-count="20">20</button><button type="button" data-count="40">40</button></div><button class="btn primary wide" type="submit">Begin session</button></form></section>{% endblock %}
